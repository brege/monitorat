widgets:
  network-tiles-column:
    type: network
    name: "Network: Tiles Columnated"
    log_file: network.log
    federation:
      merge: [nas-1, nas-2]
      display:
        tiles: columnate
    show:
      tiles: true
      uptime: false
      outages: false

  wiki-network-tiles-column:
    type: wiki
    name: "Config: Tiles Columnated"
    style: seamless
    doc: docs/multi/network/tiles/column.md
