widgets:
  network-combined:
    type: network
    name: "Network: Combined"
    log_file: network.log
    federation:
      merge: [nas-1, nas-2]
    metrics:
      show: true
    uptime:
      show: true
      periods:
        - period: 1 hour
          segment_size: 5 minutes
    alerts:
      show: true
      max: 5

  wiki-network-combined:
    type: wiki
    name: "Config: Network Combined"
    style: seamless
    doc: ../../../docs/multi/network/combined.md
