widgets:
  network-outages-stack:
    type: network
    name: "Network: Outages Stacked"
    collapsible: true
    log_file: network.log
    chirper:
      enabled: false
      interval_seconds: 600
      mode: ipv4
    federation:
      nodes: [nas-1, nas-2]
    metrics:
      show: false
    uptime:
      show: false
    alerts:
      show: true
      max: 5

  wiki-network-outages-stack:
    type: wiki
    name: "Config: Outages Stacked"
    parent: network-outages-stack
    mode: rail
    _suppressHeader: true
    doc: ../../../docs/network/outages/stack.md
