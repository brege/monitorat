widgets:
  network-tiles-column:
    type: network
    name: "Network: Tiles Columnated"
    collapsible: true
    log_file: network.log
    chirper:
      enabled: false
      interval_seconds: 600
      mode: ipv4
    federation:
      nodes: [nas-1, nas-2]
      display:
        tiles: columnate
    metrics:
      show: true
    uptime:
      show: false
    alerts:
      show: false

  wiki-network-tiles-column:
    type: wiki
    name: "Config: Tiles Columnated"
    parent: network-tiles-column
    mode: rail
    _suppressHeader: true
    doc: ../../../docs/network/tiles/column.md
