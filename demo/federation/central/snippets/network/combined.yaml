widgets:
  network-combined:
    type: network
    name: "Network: Combined"
    log_file: network.log
    chirper:
      enabled: false
      interval_seconds: 600
      mode: ipv4
    federation:
      nodes: [nas-1, nas-2]
    metrics:
      show: true
    uptime:
      show: true
      periods:
        - period: 1 hour
          segment_size: 5 minutes
        - period: 6 hours
          segment_size: 30 minutes
        - period: 1 day
          segment_size: 2 hours
    alerts:
      show: true
      max: 5

  wiki-network-combined:
    type: wiki
    name: "Config: Network Combined"
    mode: rail
    _suppressHeader: true
    doc: ../../docs/network/combined.md
