widgets:
  network-outages-column:
    type: network
    name: "Network: Outages Columnated"
    log_file: network.log
    chirper:
      enabled: false
      interval_seconds: 600
      mode: ipv4
    federation:
      nodes: [nas-1, nas-2]
      display:
        outages: columnate
    metrics:
      show: false
    uptime:
      show: false
    alerts:
      show: true
      max: 5

  wiki-network-outages-column:
    type: wiki
    name: "Config: Outages Columnated"
    mode: rail
    _suppressHeader: true
    doc: ../../../../docs/multi/network/outages/column.md
