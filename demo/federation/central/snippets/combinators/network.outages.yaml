widgets:
  network-outages-merge:
    type: network
    name: "Network: Outages and filtering"
    collapsible: true
    log_file: network.log
    chirper:
      enabled: false
      interval_seconds: 600
      mode: ipv4
    federation:
      nodes: [nas-1, nas-2]
    metrics:
      show: false
    uptime:
      show: false
    alerts:
      show: true
      max: 10

  wiki-network-outages-merge:
    type: wiki
    name: "Config: Outages Merged"
    parent: network-outages-merge
    _suppressHeader: true
    mode: rail
    doc: ../../docs/combinators/network.outages.md
