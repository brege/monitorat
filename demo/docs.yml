defaults:
  summary: Show config
  lang: yaml
documents:
  - output: demo/simple/docs/metrics.md
    preface: |-
      ### Metrics Widget

      Metrics provides an overview of system performance, including CPU, memory, disk, network usage, and temperature over time. Continuous data is logged to `metrics.csv`; snapshots of tiles-data are applied on each page refresh. Batter usage is also available for laptop users.
    include: snippets/metrics.yaml
  - output: demo/simple/docs/network.md
    preface: |-
      ### Network Widget

      The Network widget tracks uptime and outages based on a ddclient-style log file. This demo uses a synthetic `network.log` file generated by `demo/setup.py --demo`.

      #### Log format
      ```
      MMM DD HH:MM:SS <host> <process>: INFO:    [example.com]> detected IPv4 address 10.0.0.1
      MMM DD HH:MM:SS <host> <process>: FAILED:  [example.com]> updating example.com: nohost: unable to resolve current IP
      ```

      This example is limited to seven days.
    include: snippets/network.yaml
  - output: demo/simple/docs/reminders.md
    preface: |-
      ### Reminders Widget

      The Reminders widget tracks expiring items and sends nudges or urgent notifications based on your schedule.
    include: snippets/reminders.yaml
  - output: demo/simple/docs/services.md
    preface: |-
      ### Services Widget

      The Services widget shows which systemd services, timers, and docker containers are running or have failed, along with URLs for convenient access. The URLs in this demo simply link to their source code repository.
    include: snippets/services.yaml
  - output: demo/simple/docs/speedtest.md
    preface: |-
      ### Speedtest Widget

      The Speedtest widget keeps a record of your internet performance over time. It does not perform automated runs.
    include: snippets/speedtest.yaml
  - output: demo/simple/docs/quick-links.md
    preface: |-
      ## Links

      ### Demos
      - **Simple** - [http://monitorat.brege.org/](http://monitorat.brege.org/)
      - **Widget Features and Modes** - [http://monitorat.brege.org/advanced](http://monitorat.brege.org/advanced)
      - **Federation** - [http://monitorat.brege.org/federation](http://monitorat.brege.org/federation)

      ### Repositories
      - **GitHub** - [https://github.com/brege/monitorat](https://github.com/brege/monitorat)
      - **PyPI** - [https://pypi.org/project/monitorat](https://pypi.org/project/monitorat) `uv tool install monitorat`
    include: snippets/quick-links.yaml
  - output: demo/advanced/docs/metrics/full.md
    preface: Full metrics widget with custom chart periods.
    include: snippets/metrics/full.yaml
  - output: demo/advanced/docs/metrics/tiles.md
    preface: Metrics tiles only (history hidden).
    include: snippets/metrics/tiles.yaml
    footer: |-
      Use `show.history: false` to display only the stat tiles.
  - output: demo/advanced/docs/metrics/history.md
    preface: Metrics history only (tiles hidden).
    include: snippets/metrics/history.yaml
    footer: |-
      Use `show.tiles: false` to display only the chart/table history.
  - output: demo/advanced/docs/network/full.md
    preface: Network with tiles, uptime, and outages enabled (chirper off).
    include: snippets/network/full.yaml
  - output: demo/advanced/docs/network/tiles.md
    preface: Network tiles only (uptime/outages hidden).
    include: snippets/network/tiles.yaml
    footer: |-
      Network has three features: `tiles`, `uptime`, `outages`.
  - output: demo/advanced/docs/network/uptime.md
    preface: Network uptime only (tiles/outages hidden).
    include: snippets/network/uptime.yaml
    footer: Show only the uptime pill visualization.
  - output: demo/advanced/docs/network/outages.md
    preface: Network outages only (tiles/uptime hidden).
    include: snippets/network/outages.yaml
    footer: Show only the outage alerts list.
  - output: demo/advanced/docs/speedtest/full.md
    preface: Speedtest defaults to the chart view with a 1 month period.
    include: snippets/speedtest/full.yaml
  - output: demo/advanced/docs/speedtest/controls.md
    preface: Speedtest controls only (history hidden).
    include: snippets/speedtest/controls.yaml
    footer: |-
      Use `show.history: false` to display only the run button.
  - output: demo/advanced/docs/speedtest/history.md
    preface: Speedtest history only (controls hidden).
    include: snippets/speedtest/history.yaml
    footer: |-
      Use `show.controls: false` to display only the chart/table.
  - output: demo/advanced/docs/services/tiles.md
    preface: Full services widget in the default tiles layout.
    include: snippets/services/tiles.yaml
  - output: demo/advanced/docs/services/compact.md
    preface: Compact services layout with scaled icons.
    include: snippets/services/compact.yaml
  - output: demo/advanced/docs/reminders/full.md
    preface: Full reminders widget with the default layout.
    include: snippets/reminders.yaml
  - output: demo/advanced/docs/wiki/index.md
    preface: Seamless README wiki with the header suppressed.
    include: snippets/wiki/full.yaml
  - output: demo/advanced/docs/wiki/rail.md
    preface: |-
      Renders the Markdown file with a small bar on the left.

      Mode: rail (narrow sidebar layout).
    include: snippets/wiki/rail.yaml
  - output: demo/advanced/docs/wiki/featured.md
    preface: |-
      Renders the Markdown file on an elevated card.

      Mode: featured (prominent header styling).
    include: snippets/wiki/featured.yaml
  - output: demo/advanced/docs/wiki/seamless.md
    preface: |-
      Renders the Markdown file without any visual separation.

      Mode: seamless (no visual separation).
    include: snippets/wiki/seamless.yaml
  - output: demo/advanced/docs/quick-links.md
    preface: |-
      ## Links

      ### Demos
      - **Simple** - [http://monitorat.brege.org/](http://monitorat.brege.org/)
      - **Widget Features and Modes** - [http://monitorat.brege.org/advanced](http://monitorat.brege.org/advanced)
      - **Federation** - [http://monitorat.brege.org/federation](http://monitorat.brege.org/federation)

