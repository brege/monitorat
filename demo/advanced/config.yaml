# Advanced Single-Node Demo
#
# Snippets organized by widget category
# Docs mirror the snippet structure for {{file:...}} shortcodes

includes:
  # Widget defaults
  - ../simple/snippets/metrics.yaml
  - ../simple/snippets/network.yaml
  - ../simple/snippets/services.yaml
  - ../simple/snippets/reminders.yaml
  - ../simple/snippets/speedtest.yaml
  - ../simple/snippets/wiki.yaml

  # Site
  - snippets/site.yaml

  # Single-node widgets
  - snippets/wiki/full.yaml
  - snippets/metrics/full.yaml
  - snippets/services/tiles.yaml
  - snippets/services/compact.yaml
  - snippets/reminders.yaml
  - snippets/speedtest/full.yaml
  - snippets/network/full.yaml

  # Single-node wiki modes
  - snippets/wiki/rail.yaml
  - snippets/wiki/featured.yaml
  - snippets/wiki/seamless.yaml
  - snippets/wiki/quick-links.yaml

  # Single-node feature toggles
  - snippets/metrics/tiles.yaml
  - snippets/metrics/history.yaml
  - snippets/speedtest/controls.yaml
  - snippets/speedtest/history.yaml
  - snippets/network/tiles.yaml
  - snippets/network/uptime.yaml
  - snippets/network/outages.yaml

demo: true

paths:
  data: ../simple/data/
  img: ../simple/img/
  favicon: ../simple/img/favicon.svg

widgets:
  enabled:
    - wiki-readme
    ## Wiki modes
    - wiki-mode-rail
    - wiki-mode-featured
    - wiki-mode-seamless

    # Single-Node


    ## Metrics
    - metrics-single
    - wiki-metrics-single
    - metrics-tiles
    - wiki-metrics-tiles
    - metrics-history
    - wiki-metrics-history

    ## Services
    - services-single
    - wiki-services-single
    - services-compact
    - wiki-services-compact

    ## Reminders
    - reminders-single
    - wiki-reminders-single

    ## Speedtest
    - speedtest-single
    - wiki-speedtest-single
    - speedtest-controls
    - wiki-speedtest-controls
    - speedtest-history
    - wiki-speedtest-history

    ## Network
    - network-single
    - wiki-network-single
    - network-tiles
    - wiki-network-tiles
    - network-uptime
    - wiki-network-uptime
    - network-outages
    - wiki-network-outages
    - wiki-quick-links
