# Advanced Single-Node Demo
#
# Snippets organized by widget category
# Docs mirror the snippet structure for {{file:...}} shortcodes

includes:
  # Widget defaults
  - ../simple/include/metrics.yaml
  - ../simple/include/network.yaml
  - ../simple/include/services.yaml
  - ../simple/include/reminders.yaml
  - ../simple/include/speedtest.yaml
  - ../simple/include/wiki.yaml

  # Site
  - snippets/site.yaml

  # Single-node widgets
  - snippets/widgets/wiki.yaml
  - snippets/widgets/metrics.yaml
  - snippets/widgets/services.yaml
  - snippets/widgets/reminders.yaml
  - snippets/widgets/speedtest.yaml
  - snippets/widgets/network.yaml

  # Single-node wiki modes
  - snippets/wiki/rail.yaml
  - snippets/wiki/featured.yaml
  - snippets/wiki/seamless.yaml

  # Single-node feature toggles
  - snippets/metrics/tiles-only.yaml
  - snippets/metrics/history-only.yaml
  - snippets/speedtest/controls-only.yaml
  - snippets/speedtest/history-only.yaml
  - snippets/network/tiles-only.yaml
  - snippets/network/uptime-only.yaml
  - snippets/network/outages-only.yaml

demo: true

paths:
  data: ../simple/data/
  img: ../simple/img/
  favicon: ../simple/img/favicon.svg

widgets:
  enabled:
    - wiki-readme
    ## Wiki modes
    - wiki-mode-rail
    - wiki-mode-featured
    - wiki-mode-seamless

    # Single-Node


    ## Metrics
    - metrics-single
    - wiki-metrics-single
    - metrics-tiles-only
    - wiki-metrics-tiles-only
    - metrics-history-only
    - wiki-metrics-history-only

    ## Services
    - services-single
    - wiki-services-single

    ## Reminders
    - reminders-single
    - wiki-reminders-single

    ## Speedtest
    - speedtest-single
    - wiki-speedtest-single
    - speedtest-controls-only
    - wiki-speedtest-controls-only
    - speedtest-history-only
    - wiki-speedtest-history-only

    ## Network
    - network-single
    - wiki-network-single
    - network-tiles-only
    - wiki-network-tiles-only
    - network-uptime-only
    - wiki-network-uptime-only
    - network-outages-only
    - wiki-network-outages-only
