widgets:
  network-outages-only:
    type: network
    name: "Network: Outages Only"
    log_file: network.log
    chirper:
      enabled: false
      interval_seconds: 600
      mode: ipv4
    metrics:
      show: false
    uptime:
      show: false
    alerts:
      show: true
    show:
      tiles: false
      uptime: false
      outages: true
    alerts:
      show: true
      max: 10

  wiki-network-outages-only:
    type: wiki
    name: "Config: Outages Only"
    _suppressHeader: true
    mode: seamless
    doc: ../../docs/single/features/network-outages.md
