widgets:
  network-uptime-only:
    type: network
    name: "Network: Uptime Only"
    log_file: network.log
    chirper:
      enabled: false
      interval_seconds: 600
      mode: ipv4
    metrics:
      show: false
    alerts:
      show: false
    show:
      tiles: false
      uptime: true
      outages: false
    uptime:
      show: true
      periods:
        - period: 1 hour
          segment_size: 5 minutes

  wiki-network-uptime-only:
    type: wiki
    name: "Config: Uptime Only"
    _suppressHeader: true
    mode: seamless
    doc: ../../docs/single/features/network-uptime.md
