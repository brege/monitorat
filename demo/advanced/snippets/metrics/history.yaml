widgets:
  metrics-history:
    type: metrics
    name: "Metrics: History - Default"
    collapsible: true
    show:
      tiles: false
      history: true
    chart:
      periods: [24 hours, 6 hours, 1 hour]
      default_period: 6 hours
      curve:
        fill: true
        interpolation: 0.3
        ghosts: true

  wiki-metrics-history:
    type: wiki
    name: "Config: Default Curve"
    parent: metrics-history
    _suppressHeader: true
    mode: rail
    doc: ../../docs/metrics/history.md
