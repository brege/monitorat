---
repos:
  - repo: https://github.com/biomejs/pre-commit
    rev: v2.4.6
    hooks:
      - id: biome-check
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.5  # Check for latest version
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: ty
        name: ty
        entry: uv run ty check
        language: system
        types: [python]
        pass_filenames: false
      - id: demo-docs
        name: demo/docs.py
        entry: python demo/docs.py
        language: system
        pass_filenames: false
  - repo: https://github.com/lycheeverse/lychee
    rev: lychee-v0.23.0
    hooks:
      - id: lychee
        args: [--offline]
