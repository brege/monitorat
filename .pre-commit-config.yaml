---
repos:
  - repo: https://github.com/biomejs/pre-commit
    rev: v2.3.10
    hooks:
      - id: biome-check
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.11  # Check for latest version
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: demo-docs
        name: demo/docs.py
        entry: python demo/docs.py
        language: system
        pass_filenames: false
