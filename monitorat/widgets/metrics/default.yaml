widgets:
  metrics:  # temperature, cpu, memory, disk
    name: System Metrics
    collapsible: true  # show hide/show toggle (default: false)
    hidden: false  # start collapsed (default: false)
    min_width: 400
    features:
      snapshot:
        header: "Current Status"
      history:
        header: "History"
    daemon:
      enabled: true
      interval_seconds: 60  # sampling cadence for the collector (seconds)
    history:
      columns:
        - cpu_percent
        - memory_percent
        - disk_read_mb
        - disk_write_mb
        - net_rx_mb
        - net_tx_mb
        - load_1min
        - temp_c
      # - battery_percent
      default: chart  # default view: "chart" or "table"
      periods: [1 year, 30 days, 7 days, 24 hours, 6 hours, 1 hour]
      file: metrics.csv  # relative to data path
      max_rows: 1000  # cap for history API responses
      table:
        min: 5  # minimum rows to show
        max: 200  # maximum rows to load
      chart:
        default_metric: cpu_memory  # options: cpu_memory, cpu_percent, memory_percent, disk_io, net_io, temp_c, load_1min, battery_percent
        default_period: 1 hour  # natural language
        height: 300px  # fixed chart height
        curve:
          fill: true  # shade area under line
          interpolation: 0.3  # 0: straight lines, 1.0: max smoothing
          ghosts: true  # show raw data overlay
    snapshots:
      enabled: true
      quantities:
        - uptime_seconds
        - load_summary
        - memory_usage
        - temp_c
        - disk_usage
        - storage_usage
      # - battery_percent
      storage:
        mounts: []  # optional: paths to monitor
    thresholds:  # caution/critical cutoffs for status badges
      load_1min:
        caution: 1.0
        critical: 2.0
        normalize_per_cpu: true
      memory_percent:
        caution: 75
        critical: 90
      temp_c:
        caution: 60
        critical: 80
      disk_percent:
        caution: 80
        critical: 95
      storage_percent:
        caution: 85
        critical: 95
