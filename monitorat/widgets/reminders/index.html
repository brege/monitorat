<style>
.reminder-alerts { margin-top: 18px; }
.reminder-alert { cursor: pointer; display: flex; align-items: flex-start; gap: 12px; transition: background-color 0.3s ease, border-left-color 0.3s ease; }
.reminder-alert-icon { width: 24px; height: 24px; object-fit: contain; flex-shrink: 0; margin-top: 2px; pointer-events: auto; }
.reminder-alert-content { flex: 1; min-width: 0; }
.reminder-alert-text { margin-bottom: 4px; }
.reminder-alert-name { font-weight: 600; }
.reminder-alert-stats { display: flex; gap: 16px; font-size: 0.85rem; color: var(--text-muted); }
.reminder-alert-description { color: var(--text-muted) !important; }
.widget-controls { display: flex; align-items: center; gap: 1rem; margin-bottom: 1rem; }
.widget-controls .spacer { flex: 1; }
.sort-direction-select { min-width: 5.5rem; }
@media (min-width: 641px) {
  .reminder-alert { align-items: center; }
  .reminder-alert-icon { margin-top: 0; }
  .reminder-alert-content { display: flex; justify-content: space-between; align-items: center; }
  .reminder-alert-text { margin-bottom: 0; }
}
</style>

<section class="reminders">
  <h2>Login Reminders</h2>
  <div class="widget-controls">
    <select class="alerts-toggle reminders-sort-field">
      <option value="due">Due</option>
      <option value="name">Name</option>
      <option value="touched">Touched</option>
    </select>
    <select class="alerts-toggle sort-direction-select reminders-sort-dir" aria-label="Sort direction">
      <option value="asc">asc</option>
      <option value="desc">desc</option>
    </select>
    <span class="spacer"></span>
    <button type="button" class="alerts-toggle" onclick="testNotification()">Test Notification</button>
  </div>
  <div class="reminder-alerts alert-list"></div>
</section>
