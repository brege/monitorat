<style>
.service-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
.service-grid-inner { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
.service-grid > .federation-stacked,
.service-grid > .federation-columns { grid-column: 1 / -1; }
.service-card { padding: 16px; display: flex; align-items: center; gap: 12px; min-height: 80px; cursor: pointer; }
.service-icon { width: 32px; height: 32px; object-fit: contain; }
.service-info { flex: 1; }
.service-name { font-weight: 600; margin-bottom: 4px; }
.service-status { font-size: 0.9rem; color: var(--text-muted); }
.widget-controls { display: flex; align-items: center; gap: 1rem; margin-bottom: 1rem; }
.sort-direction-select { min-width: 5.5rem; }
</style>

<section class="services">
  <h2>Services</h2>
  <div class="widget-controls">
    <select class="alerts-toggle services-sort-field">
      <option value="name">Name</option>
      <option value="status">Status</option>
    </select>
    <select class="alerts-toggle sort-direction-select services-sort-dir" aria-label="Sort direction">
      <option value="asc">asc</option>
      <option value="desc">desc</option>
    </select>
  </div>
  <div class="service-grid"></div>
</section>
