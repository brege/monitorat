<style>
.service-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
.service-grid-inner { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
.service-grid > .federation-stacked,
.service-grid > .federation-columns { grid-column: 1 / -1; }
.service-card { padding: 16px; display: flex; align-items: center; gap: 12px; min-height: 80px; cursor: pointer; }
.service-icon { width: 32px; height: 32px; object-fit: contain; }
.service-info { flex: 1; }
.service-name { font-weight: 600; margin-bottom: 4px; }
.service-status { font-size: 0.9rem; color: var(--text-muted); }
.widget-controls { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.widget-sort-select { padding: 4px 8px; font-size: 0.85rem; border-radius: 4px; border: 1px solid var(--border-color, #444); background: var(--bg-secondary, #2a2a2a); color: var(--text-primary, #fff); cursor: pointer; }
.sort-direction-btn { background: none; border: 1px solid var(--border-color, #444); border-radius: 4px; padding: 4px 6px; cursor: pointer; display: flex; align-items: center; }
.sort-direction-btn svg { width: 14px; height: 14px; fill: var(--text-secondary, #aaa); }
.sort-direction-btn:hover svg { fill: var(--text-primary, #fff); }
</style>

<section class="services">
  <h2>Services</h2>
  <div class="widget-controls">
    <select class="widget-sort-select services-sort-field">
      <option value="name">Name</option>
      <option value="status">Status</option>
    </select>
    <button class="sort-direction-btn services-sort-dir" title="Toggle sort direction">
      <svg class="sort-asc" viewBox="0 0 24 24"><path d="M7 14l5-5 5 5H7z"/></svg>
      <svg class="sort-desc" viewBox="0 0 24 24" style="display:none"><path d="M7 10l5 5 5-5H7z"/></svg>
    </button>
  </div>
  <div class="service-grid"></div>
</section>
