---
# minimal monitorat configuration that renders a simple dashboard.
includes: []
site:
  name: monitor@
  title: System Monitor
  base_url: http://localhost:6161
  theme: default    # default | formal
  editing: false
paths:              # all paths relative to config home (e.g. ~/.config/monitorat/) or absolute
  data: data/
  img: img/
  favicon: favicon.ico
  vendors: vendors/
  widgets: [widgets/]
  theme: null       # your themes/my-theme.css applies on top of site.theme
notifications:
  apprise_urls: []
  interval: 300
auth:
  api_key: ''
federation:
  enabled: false
  timeout_seconds: 10
  remotes: []
demo: false
widgets:
  columns: 1        # default layout: 1 = stacked, 2+ = columnated, auto = responsive
  enabled:          # visibility plus order
    - metrics
    - speedtest
    - wiki
privacy:            # when sharing screenshots or 'monitorat config'
  mask_ips: true
  replacements: {}  # { my-site.com: example.com ; ... }
