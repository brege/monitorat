<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>monitor@</title>
  
  <link rel="icon" sizes="32x32" href="favicon.ico">
  <link rel="stylesheet" href="vendors/github-markdown.min.css">
  <link rel="stylesheet" href="themes/default.css">
  <link rel="stylesheet" href="header/style.css">
  <link rel="stylesheet" href="theme-overlay.css" onerror="this.remove()">
  <link rel="stylesheet" href="theme.css" onerror="this.remove()">
  <script>
    (function () {
      try {
        var storedTheme = localStorage.getItem('monitor-theme');
        if (storedTheme === 'dark' || storedTheme === 'light') {
          document.documentElement.setAttribute('data-theme', storedTheme);
        }
        var colorTheme = localStorage.getItem('monitor-color-theme');
        var overlay = document.querySelector('link[href*="theme-overlay"]');
        if (colorTheme === 'default') {
          if (overlay) overlay.remove();
        } else if (colorTheme && colorTheme !== 'default') {
          if (overlay) {
            overlay.href = 'themes/' + colorTheme + '.css';
            overlay.dataset.colorTheme = colorTheme;
          }
        }
      } catch (_) {
        /* localStorage may be unavailable */
      }
    })();
  </script>
</head>
<body>
  <main>
    <div id="header-container"></div>
    <script>
      window.headerLoaded = fetch('header/index.html')
        .then(function(r) { return r.text(); })
        .then(function(html) {
          document.getElementById('header-container').innerHTML = html;
        });
    </script>
    <div class="widget-stack">
      <!-- Widgets are dynamically created based on config -->
    </div>
  </main>
  <script src="vendors/markdown-it.min.js"></script>
  <script src="vendors/markdown-it-anchor.min.js"></script>
  <script src="vendors/markdown-it-toc-done-right.min.js"></script>
  <script src="vendors/mermaid.js"></script>
  <script src="shared/ScriptLoader.js"></script>
  <script src="shared/TimeSeries.js"></script>
  <script src="shared/ChartManager.js"></script>
  <script src="shared/ChartLegend.js"></script>
  <script src="shared/TableManager.js"></script>
  <script src="shared/StatusIndicator.js"></script>
  <script src="shared/SortBy.js"></script>
  <script src="shared/NotificationTester.js"></script>
  <script src="shared/FeatureVisibility.js"></script>
  <script src="shared/FederationRenderer.js"></script>
  <script src="shared/TileRenderer.js"></script>
  <script src="shared/Modal.js"></script>
  <script src="app.js"></script>
</body>
</html>
