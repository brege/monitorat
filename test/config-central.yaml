includes:
  - ../demo/include/wiki.yaml

site:
  name: "@central"
  title: "Central Command"

paths:
  data: ../demo/data/

federation:
  enabled: true
  timeout_seconds: 10
  remotes:
    - name: nas-1
      url: http://localhost:6601
      api_key: "nas-1-secret"
    - name: nas-2
      url: http://localhost:6602
      api_key: "nas-2-secret"

demo: true

widgets:
  enabled:
    - wiki
    - metrics-nas-1
    - metrics-nas-2

  metrics-nas-1:
    type: metrics
    remote: nas-1
    name: "NAS-1 Metrics"

  metrics-nas-2:
    type: metrics
    remote: nas-2
    name: "NAS-2 Metrics"
