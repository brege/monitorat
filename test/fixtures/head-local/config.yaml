includes: []

site:
  name: "@head"
  title: "Federation Head (Local Test)"

paths:
  data: data/

federation:
  enabled: true
  timeout_seconds: 10
  remotes:
    - name: prod
      url: http://localhost:6161

demo: true

widgets:
  enabled:
    - metrics-prod
    - wiki-prod

  metrics-prod:
    type: metrics
    remote: prod
    name: "Production Metrics"
    chart:
      periods: [30 days, 1 week, 24 hours, 6 hours, 1 hour]
      default_period: 6 hours

  wiki-prod:
    type: wiki
    remote: prod
    name: "Production Wiki"
    doc: true
