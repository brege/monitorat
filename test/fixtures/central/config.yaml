includes: []

site:
  name: "@central"
  title: "Central Command"

paths:
  data: data/

federation:
  enabled: true
  timeout_seconds: 10
  remotes:
    - name: nas-1
      url: http://localhost:6601
      api_key: "nas-1-secret"
    - name: nas-2
      url: http://localhost:6602
      api_key: "nas-2-secret"

demo: true

widgets:
  enabled:
    - wiki-nas-1
    - wiki-nas-2
    - metrics-combined
    - metrics-nas-1
    - metrics-nas-2
    - services-nas-1
    - services-nas-2
    - reminders-nas-1
    - reminders-nas-2
    - speedtest-nas-1
    - speedtest-nas-2
    - network-nas-1
    - network-nas-2

  wiki-nas-1:
    type: wiki
    remote: nas-1
    name: "NAS-1 Wiki"
    doc: true

  wiki-nas-2:
    type: wiki
    remote: nas-2
    name: "NAS-2 Wiki"
    doc: true

  metrics-combined:
    type: metrics
    name: "All Systems"
    federation:
      merge: [nas-1, nas-2]
    chart:
      periods: [24 hours, 6 hours, 1 hour]
      default_period: 6 hours

  metrics-nas-1:
    type: metrics
    remote: nas-1
    name: "NAS-1 Metrics"

  metrics-nas-2:
    type: metrics
    remote: nas-2
    name: "NAS-2 Metrics"

  services-nas-1:
    type: services
    remote: nas-1
    name: "NAS-1 Services"

  services-nas-2:
    type: services
    remote: nas-2
    name: "NAS-2 Services"

  reminders-nas-1:
    type: reminders
    remote: nas-1
    name: "NAS-1 Reminders"

  reminders-nas-2:
    type: reminders
    remote: nas-2
    name: "NAS-2 Reminders"

  speedtest-nas-1:
    type: speedtest
    remote: nas-1
    name: "NAS-1 Speedtest"

  speedtest-nas-2:
    type: speedtest
    remote: nas-2
    name: "NAS-2 Speedtest"

  network-nas-1:
    type: network
    remote: nas-1
    name: "NAS-1 Network"

  network-nas-2:
    type: network
    remote: nas-2
    name: "NAS-2 Network"
